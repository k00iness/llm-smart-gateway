<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Gateway Dashboard</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c2330; --muted:#667085; --line:#e4e7ec;
          --accent:#2563eb; --green:#16a34a; --orange:#ea580c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f141b; --card:#171e28; --text:#e6eaf0; --muted:#8b97a8; --line:#273141;
            --accent:#60a5fa; --green:#4ade80; --orange:#fb923c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:20px; }
  .bar { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  input { flex:1; min-width:220px; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
          background:var(--card); color:var(--text); font-size:.95rem; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff;
           font-size:.95rem; cursor:pointer; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .label { color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; }
  .value { font-size:1.8rem; font-weight:600; margin-top:6px; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:12px; }
  .row { margin:12px 0; }
  .row .head { display:flex; justify-content:space-between; font-size:.9rem; margin-bottom:6px; }
  .track { height:12px; background:var(--line); border-radius:6px; overflow:hidden; }
  .fill { height:100%; border-radius:6px; transition:width .4s; }
  #status { font-size:.85rem; color:var(--muted); min-height:1.2em; }
  #status.err { color:var(--orange); }
</style>
</head>
<body>
<main>
  <h1>LLM Gateway</h1>
  <div class="sub">Cache hits, latency and estimated savings. Refreshes every 5 seconds.</div>

  <div class="bar">
    <input id="key" type="password" placeholder="Admin API key" autocomplete="off">
    <button id="go">Connect</button>
  </div>
  <div id="status"></div>

  <div class="grid">
    <div class="card"><div class="label">Requests</div><div class="value" id="total">–</div></div>
    <div class="card"><div class="label">Cache hit rate</div><div class="value" id="ratio">–</div></div>
    <div class="card"><div class="label">Tokens saved</div><div class="value" id="tokens">–</div></div>
    <div class="card"><div class="label">Est. cost saved</div><div class="value" id="cost">–</div></div>
    <div class="card"><div class="label">Fallbacks</div><div class="value" id="fallbacks">–</div></div>
  </div>

  <div class="panel">
    <div class="label">Average latency by path</div>
    <div class="row">
      <div class="head"><span>Cache hit</span><span id="lat-cache">–</span></div>
      <div class="track"><div class="fill" id="bar-cache" style="background:var(--green);width:0"></div></div>
    </div>
    <div class="row">
      <div class="head"><span>LLM call</span><span id="lat-llm">–</span></div>
      <div class="track"><div class="fill" id="bar-llm" style="background:var(--orange);width:0"></div></div>
    </div>
    <div id="speedup" class="sub" style="margin:8px 0 0"></div>
  </div>

  <div class="panel">
    <div class="label">Hits vs misses</div>
    <div class="row">
      <div class="track" style="height:18px"><div class="fill" id="bar-ratio" style="background:var(--accent);width:0"></div></div>
      <div class="head" style="margin-top:6px"><span id="hits-txt">–</span><span id="miss-txt">–</span></div>
    </div>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let timer = null;

  function setStatus(msg, isErr) {
    $("status").textContent = msg;
    $("status").className = isErr ? "err" : "";
  }

  async function refresh() {
    const key = $("key").value.trim();
    if (!key) { setStatus("Enter the admin key.", true); return; }
    try {
      const res = await fetch("/v1/metrics", { headers: { Authorization: "Bearer " + key } });
      if (res.status === 401) { setStatus("Wrong admin key.", true); return; }
      if (!res.ok) { setStatus("Server error: " + res.status, true); return; }
      render(await res.json());
      setStatus("Updated " + new Date().toLocaleTimeString());
    } catch (e) {
      setStatus("Cannot reach the gateway.", true);
    }
  }

  function render(m) {
    $("total").textContent = m.total_requests;
    $("ratio").textContent = (m.cache_hit_ratio * 100).toFixed(1) + "%";
    $("tokens").textContent = m.total_tokens_saved.toLocaleString();
    $("cost").textContent = "$" + m.estimated_cost_saved_usd.toFixed(5);
    $("fallbacks").textContent = m.fallbacks;

    const maxLat = Math.max(m.avg_latency_cache_ms, m.avg_latency_llm_ms, 1);
    $("lat-cache").textContent = m.avg_latency_cache_ms.toFixed(0) + " ms";
    $("lat-llm").textContent = m.avg_latency_llm_ms.toFixed(0) + " ms";
    $("bar-cache").style.width = (m.avg_latency_cache_ms / maxLat * 100) + "%";
    $("bar-llm").style.width = (m.avg_latency_llm_ms / maxLat * 100) + "%";
    $("speedup").textContent = (m.avg_latency_cache_ms > 0 && m.avg_latency_llm_ms > 0)
      ? "Cache hits are about " + (m.avg_latency_llm_ms / m.avg_latency_cache_ms).toFixed(0) + "x faster than an LLM call."
      : "";

    $("bar-ratio").style.width = (m.cache_hit_ratio * 100) + "%";
    $("hits-txt").textContent = m.cache_hits + " hits";
    $("miss-txt").textContent = m.cache_misses + " misses";
  }

  $("go").addEventListener("click", () => {
    sessionStorage.setItem("gw_admin", $("key").value.trim());
    clearInterval(timer);
    refresh();
    timer = setInterval(refresh, 5000);
  });

  const saved = sessionStorage.getItem("gw_admin");
  if (saved) { $("key").value = saved; $("go").click(); }
</script>
</body>
</html>
